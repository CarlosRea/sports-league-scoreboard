name: sports-league-scoreboard

services:
  postgres:
    image: postgres:16-alpine
    container_name: scoreboard-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sdip}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sdip}
      POSTGRES_DB: ${POSTGRES_DB:-sdip}
    ports:
      - "${POSTGRES_PORT:-5434}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sdip} -d ${POSTGRES_DB:-sdip}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      default:
        aliases:
          - db
          - postgres

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${APP_IMAGE:-sports-scoreboard:latest}
    container_name: scoreboard-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-sdip}:${POSTGRES_PASSWORD:-sdip}@postgres:5432/${POSTGRES_DB:-sdip}
      SDIP_DATABASE_URL: postgresql://${POSTGRES_USER:-sdip}:${POSTGRES_PASSWORD:-sdip}@postgres:5432/${POSTGRES_DB:-sdip}
      PORT: 8009
      HOST: 0.0.0.0
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev_jwt_secret_sports_scoreboard_2026}
      ENVIRONMENT: development
    ports:
      - "${APP_PORT:-8009}:8009"

volumes:
  pgdata:
    name: scoreboard-pgdata
