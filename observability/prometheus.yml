# ==============================================================================
# Prometheus Configuration
# ==============================================================================
# Scrapes internal Prometheus metrics and metrics forwarded by the OpenTelemetry Collector.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Self-monitoring
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # OpenTelemetry Collector forwarded application metrics
  - job_name: "otel-collector-metrics"
    static_configs:
      - targets: ["otel-collector:8889"]

  # OpenTelemetry Collector internal operational metrics
  - job_name: "otel-collector-internal"
    static_configs:
      - targets: ["otel-collector:8888"]
