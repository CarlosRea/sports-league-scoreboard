name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  # ============================================================================
  # 1. Backend Tests (Runs in parallel with Frontend Tests)
  # ============================================================================
  test-backend:
    name: Backend Unit & Lint Tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up uv package manager
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: |
          cd backend
          uv sync

      - name: Lint backend code with Ruff
        run: |
          cd backend
          uv run ruff check

      - name: Run backend unit tests with Pytest
        run: |
          cd backend
          uv run pytest

  # ============================================================================
  # 2. Frontend Tests (Runs in parallel with Backend Tests)
  # ============================================================================
  test-frontend:
    name: Frontend Unit & Build Tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: Lint frontend code with Oxlint
        run: |
          cd frontend
          npm run lint

      - name: Type check with TypeScript
        run: |
          cd frontend
          npx tsc --noEmit

      - name: Run frontend unit tests with Vitest
        run: |
          cd frontend
          npm run test

      - name: Verify production build compiles cleanly
        run: |
          cd frontend
          npm run build

  # ============================================================================
  # 3. Docker Compose Stack, Health Check & Integration / E2E Tests
  # ============================================================================
  integration-and-e2e:
    name: Docker Compose, Health Check & E2E Tests
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and start Docker Compose stack
        run: |
          docker compose up -d --build

      - name: Validate container health endpoint (http://localhost:8009/health)
        run: |
          echo "Waiting for backend/app to become healthy on http://localhost:8009/health..."
          timeout 60s bash -c 'until curl -sf http://localhost:8009/health | grep -q "healthy"; do
            echo "Waiting for healthcheck response..."
            sleep 2
          done'
          echo "Health check succeeded! Response:"
          curl -i http://localhost:8009/health

      - name: Set up uv package manager
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies for integration tests
        run: |
          cd backend
          uv sync

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install root dependencies & Playwright browsers
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run integration and end-to-end tests (make e2e)
        run: |
          make e2e

      - name: Upload Playwright Test Report (on failure)
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Tear down Docker Compose stack
        if: always()
        run: |
          docker compose down -v

  # ============================================================================
  # 4. Build Stage: Build & Push Tagged Image to GHCR
  # ============================================================================
  build:
    name: Build & Push to GHCR
    runs-on: ubuntu-latest
    needs: [integration-and-e2e]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
      image_uri: ${{ steps.meta.outputs.image_uri }}
      full_image: ${{ steps.meta.outputs.full_image }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Generate YYYYMMDD-HHMMSS-shortsha Tag & Metadata
        id: meta
        run: |
          TAG="$(date -u +'%Y%m%d-%H%M%S')-$(git rev-parse --short=7 HEAD)"
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          IMAGE_URI="ghcr.io/${REPO_LOWER}"
          
          echo "image_tag=${TAG}" >> $GITHUB_OUTPUT
          echo "image_uri=${IMAGE_URI}" >> $GITHUB_OUTPUT
          echo "full_image=${IMAGE_URI}:${TAG}" >> $GITHUB_OUTPUT
          echo "Generated Tag: ${TAG}"
          echo "Full Image: ${IMAGE_URI}:${TAG}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (ghcr.io)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Release Image
        run: |
          IMAGE_URI="${{ steps.meta.outputs.image_uri }}"
          TAG="${{ steps.meta.outputs.image_tag }}"
          
          echo "Building Docker image ${IMAGE_URI}:${TAG}..."
          docker build \
            -t "${IMAGE_URI}:${TAG}" \
            -t "${IMAGE_URI}:latest" \
            -t "${IMAGE_URI}:dev" \
            .
            
          echo "Pushing images to GitHub Container Registry..."
          docker push "${IMAGE_URI}:${TAG}"
          docker push "${IMAGE_URI}:latest"
          docker push "${IMAGE_URI}:dev"

      - name: Build Stage Summary
        run: |
          echo "### 📦 Build Stage: Docker Image Pushed to GHCR" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Registry**: \`ghcr.io\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Tagged Image**: \`${{ steps.meta.outputs.full_image }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Tag Pattern**: \`${{ steps.meta.outputs.image_tag }}\` (\`YYYYMMDD-HHMMSS-shortsha\`)" >> $GITHUB_STEP_SUMMARY

  # ============================================================================
  # 5. Deploy to Dev Stage: SSH into Oracle Cloud Server & Update Dev Container
  # ============================================================================
  deploy-dev:
    name: Deploy to Dev (Oracle Cloud)
    runs-on: ubuntu-latest
    needs: [build]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    steps:
      - name: Deploy to Dev on Oracle Cloud via SSH
        uses: appleboy/ssh-action@v1
        env:
          FULL_IMAGE: ${{ needs.build.outputs.full_image }}
          IMAGE_TAG: ${{ needs.build.outputs.image_tag }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          envs: FULL_IMAGE,IMAGE_TAG,GHCR_USER,GHCR_TOKEN
          script: |
            set -e
            echo "=========================================================="
            echo " Sports League Scoreboard - Deploying to Dev Environment"
            echo " Host: Oracle Cloud Server"
            echo " Target Image: $FULL_IMAGE"
            echo "=========================================================="
            
            # Authenticate to GHCR on the server to pull private/org package
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            
            # Pull exact tagged image from ghcr.io
            echo "Pulling $FULL_IMAGE from ghcr.io..."
            docker pull "$FULL_IMAGE"
            
            cd ~/sports-league-scoreboard
            
            # Update dev container with exact tagged image
            echo "Updating dev container (scoreboard-app)..."
            DEPLOYED_VERSION="$IMAGE_TAG" APP_IMAGE="$FULL_IMAGE" docker compose up -d --no-deps app
            
            # Record current running dev tag and image for manual promotion workflow
            echo "$IMAGE_TAG" > .current-dev-tag
            echo "$FULL_IMAGE" > .current-dev-image
            
            # Validate container health
            echo "Validating dev container health on port 8009..."
            timeout 60s bash -c 'until curl -sf http://localhost:8009/health | grep -q "healthy"; do
              echo "Waiting for healthcheck response from http://localhost:8009/health..."
              sleep 2
            done'
            
            echo "Dev deployment verified successfully!"
            curl -i http://localhost:8009/health

      - name: Dev Deployment Summary
        run: |
          echo "### 🚀 Deploy to Dev: Deployment Succeeded!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Target Server**: Oracle Cloud" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Tagged Image Pulled**: \`${{ needs.build.outputs.full_image }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Tag Running in Dev**: \`${{ needs.build.outputs.image_tag }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Dev Health Check**: ✅ Verified at \`http://localhost:8009/health\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Ready for Prod Promotion**: This exact tag can now be promoted to production via \`promote-to-production.yml\`" >> $GITHUB_STEP_SUMMARY


