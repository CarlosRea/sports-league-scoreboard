name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  # ============================================================================
  # 1. Backend Tests (Runs in parallel with Frontend Tests)
  # ============================================================================
  test-backend:
    name: Backend Unit & Lint Tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up uv package manager
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: |
          cd backend
          uv sync

      - name: Lint backend code with Ruff
        run: |
          cd backend
          uv run ruff check

      - name: Run backend unit tests with Pytest
        run: |
          cd backend
          uv run pytest

  # ============================================================================
  # 2. Frontend Tests (Runs in parallel with Backend Tests)
  # ============================================================================
  test-frontend:
    name: Frontend Unit & Build Tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: Lint frontend code with Oxlint
        run: |
          cd frontend
          npm run lint

      - name: Type check with TypeScript
        run: |
          cd frontend
          npx tsc --noEmit

      - name: Run frontend unit tests with Vitest
        run: |
          cd frontend
          npm run test

      - name: Verify production build compiles cleanly
        run: |
          cd frontend
          npm run build

  # ============================================================================
  # 3. Docker Compose Stack, Health Check & Integration / E2E Tests
  # ============================================================================
  integration-and-e2e:
    name: Docker Compose, Health Check & E2E Tests
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and start Docker Compose stack
        run: |
          docker compose up -d --build

      - name: Validate container health endpoint (http://localhost:8009/health)
        run: |
          echo "Waiting for backend/app to become healthy on http://localhost:8009/health..."
          timeout 60s bash -c 'until curl -sf http://localhost:8009/health | grep -q "healthy"; do
            echo "Waiting for healthcheck response..."
            sleep 2
          done'
          echo "Health check succeeded! Response:"
          curl -i http://localhost:8009/health

      - name: Set up uv package manager
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies for integration tests
        run: |
          cd backend
          uv sync

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install root dependencies & Playwright browsers
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run integration and end-to-end tests (make e2e)
        run: |
          make e2e

      - name: Upload Playwright Test Report (on failure)
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Tear down Docker Compose stack
        if: always()
        run: |
          docker compose down -v

  # ============================================================================
  # 4. Continuous Deployment (CD)
  # ============================================================================
  deploy:
    name: Deploy Application
    runs-on: ubuntu-latest
    needs: [integration-and-e2e]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build production release container image
        run: |
          echo "Building production release image for commit ${{ github.sha }}..."
          docker build -t sports-scoreboard:${{ github.sha }} -t sports-scoreboard:latest .

      - name: Execute automated deployment
        run: |
          echo "Deploying sports-scoreboard (commit: ${{ github.sha }}) to production..."
          echo "Release Version: $(git describe --tags --always 2>/dev/null || echo ${{ github.sha }})"
          echo "Deployment target: production"
          echo "Automated CD pipeline replacing manual admin user deployment."

      - name: Summary of Deployment
        run: |
          echo "### 🚀 Continuous Deployment Successful!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Ref**: \`${{ github.ref }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Workflow Run**: [#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})" >> $GITHUB_STEP_SUMMARY
          echo "- **Backend & Frontend Tests**: ✅ Passed in parallel" >> $GITHUB_STEP_SUMMARY
          echo "- **Docker Compose & Health Check**: ✅ Verified at \`http://localhost:8009/health\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Integration & E2E Tests**: ✅ Passed against live stack" >> $GITHUB_STEP_SUMMARY
          echo "- **Deployment Security**: ✅ Automated via CI/CD (manual admin credentials removed)" >> $GITHUB_STEP_SUMMARY
