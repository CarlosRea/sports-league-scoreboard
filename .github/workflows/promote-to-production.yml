name: Promote Dev to Production

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Dev source branch, tag, or commit SHA to promote"
        required: true
        default: "main"
        type: string
      release_version:
        description: "Release version tag (e.g., v1.1.0; leave blank for auto-generated tag)"
        required: false
        default: ""
        type: string
      run_tests:
        description: "Run full verification suite (unit tests, linting, builds) before promoting"
        required: true
        default: true
        type: boolean
      run_e2e:
        description: "Run Playwright E2E browser tests against production after deployment"
        required: true
        default: true
        type: boolean
      dry_run:
        description: "Dry-run mode (build release image and validate configuration without deploying)"
        required: false
        default: false
        type: boolean
      promotion_notes:
        description: "Audit / changelog note for this promotion"
        required: false
        default: "Manual promotion from dev to production"
        type: string

concurrency:
  group: production-deployment
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

jobs:
  # ============================================================================
  # 1. Pre-Promotion Verification Gate (Tests & Quality Checks)
  # ============================================================================
  pre-promotion-verification:
    name: Pre-Promotion Verification
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.run_tests != 'false' }}
    steps:
      - name: Check out repository at source ref
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.source_ref }}

      # Backend Checks
      - name: Set up Astral uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: |
          cd backend
          uv sync

      - name: Lint backend code with Ruff
        run: |
          cd backend
          uv run ruff check

      - name: Run backend unit tests with Pytest
        run: |
          cd backend
          uv run pytest

      # Frontend Checks
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: Lint frontend code with Oxlint
        run: |
          cd frontend
          npm run lint

      - name: Type check with TypeScript
        run: |
          cd frontend
          npx tsc --noEmit

      - name: Run frontend unit tests with Vitest
        run: |
          cd frontend
          npm run test

      - name: Verify production frontend build compiles cleanly
        run: |
          cd frontend
          npm run build

  # ============================================================================
  # 2. Promote to Production Infrastructure
  # ============================================================================
  promote-to-production:
    name: Promote to Production
    runs-on: ubuntu-latest
    needs: [pre-promotion-verification]
    if: always() && (needs.pre-promotion-verification.result == 'success' || needs.pre-promotion-verification.result == 'skipped')
    steps:
      - name: Check out repository at source ref
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.source_ref }}
          fetch-depth: 0

      - name: Determine Release Version & Metadata
        id: meta
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          CURRENT_DATE=$(date -u +'%Y.%m.%d')
          
          if [ -n "${{ github.event.inputs.release_version }}" ]; then
            VERSION="${{ github.event.inputs.release_version }}"
          else
            VERSION="v${CURRENT_DATE}-${SHORT_SHA}"
          fi
          
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "short_sha=${SHORT_SHA}" >> $GITHUB_OUTPUT
          echo "Resolved Promotion Release Version: ${VERSION}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Production Release Docker Images
        run: |
          echo "Building production container image tagged as sports-scoreboard:${{ steps.meta.outputs.version }}..."
          docker build \
            -t sports-scoreboard:${{ steps.meta.outputs.version }} \
            -t sports-scoreboard:prod \
            -t sports-scoreboard:latest \
            .

      - name: Validate Production Compose Configuration
        run: |
          echo "Validating docker-compose.prod.yaml syntax and configuration..."
          docker compose -f docker-compose.prod.yaml config

      # ------------------------------------------------------------------------
      # Live Production Deployment (Skipped if Dry Run)
      # ------------------------------------------------------------------------
      - name: Deploy Production Infrastructure Stack
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          echo "Promoting dev build to production stack with docker-compose.prod.yaml..."
          
          # Initialize .env.prod with production secrets if not already created
          if [ ! -f .env.prod ]; then
            cp .env.prod.example .env.prod
            RANDOM_JWT=$(openssl rand -hex 32)
            sed -i "s/JWT_SECRET_KEY=.*/JWT_SECRET_KEY=${RANDOM_JWT}/" .env.prod
          fi
          
          # Launch isolated production stack
          docker compose -f docker-compose.prod.yaml --env-file .env.prod up -d --build

      - name: Verify Production Health Endpoint (http://localhost:8010/health)
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          echo "Waiting for production application to report healthy on port 8010..."
          timeout 60s bash -c 'until curl -sf http://localhost:8010/health | grep -q "healthy"; do
            echo "Waiting for healthcheck response from http://localhost:8010/health..."
            sleep 2
          done'
          echo "✅ Production healthcheck succeeded!"
          curl -i http://localhost:8010/health

      - name: Set up Python for Production API Integration Tests
        if: ${{ github.event.inputs.dry_run != 'true' }}
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Astral uv for Integration Tests
        if: ${{ github.event.inputs.dry_run != 'true' }}
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies & execute API tests against Production
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          cd backend
          uv sync
          cd ..
          echo "Running API integration tests against live production on port 8010..."
          API_BASE_URL=http://localhost:8010 uv run --project backend pytest tests/test_api.py -v

      - name: Execute Playwright E2E Tests against Production
        if: ${{ github.event.inputs.dry_run != 'true' && github.event.inputs.run_e2e != 'false' }}
        run: |
          echo "Installing root dependencies and Playwright browser..."
          npm ci
          npx playwright install --with-deps chromium
          echo "Running Playwright browser test suite against live production on port 8010..."
          BASE_URL=http://localhost:8010 npx playwright test

      - name: Upload Playwright Test Report on Failure
        uses: actions/upload-artifact@v4
        if: failure() && github.event.inputs.dry_run != 'true' && github.event.inputs.run_e2e != 'false'
        with:
          name: playwright-production-report
          path: playwright-report/
          retention-days: 7

      - name: Record Git Release Tag
        if: ${{ github.event.inputs.dry_run != 'true' && github.event.inputs.release_version != '' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.meta.outputs.version }}" -m "${{ github.event.inputs.promotion_notes }}" || true
          git push origin "${{ steps.meta.outputs.version }}" || echo "Tag push skipped (requires permissions or existing tag)"

      # ------------------------------------------------------------------------
      # Promotion Audit Report in GitHub Step Summary
      # ------------------------------------------------------------------------
      - name: Generate Promotion Audit Summary
        if: always()
        run: |
          STATUS="${{ job.status }}"
          DRY_RUN="${{ github.event.inputs.dry_run }}"
          
          echo "## 🚀 Production Promotion Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ "$DRY_RUN" = "true" ]; then
            echo "> [!NOTE]" >> $GITHUB_STEP_SUMMARY
            echo "> **Dry-Run Mode**: Release images were built and configuration validated, but no changes were applied to live production." >> $GITHUB_STEP_SUMMARY
          elif [ "$STATUS" = "success" ]; then
            echo "> [!IMPORTANT]" >> $GITHUB_STEP_SUMMARY
            echo "> **Promotion Status**: ✅ Successfully promoted dev version to production!" >> $GITHUB_STEP_SUMMARY
          else
            echo "> [!CAUTION]" >> $GITHUB_STEP_SUMMARY
            echo "> **Promotion Status**: ❌ Production promotion encountered errors." >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📋 Promotion Details" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          echo "| **Triggered By** | \`@${{ github.actor }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Source Ref (Dev)** | \`${{ github.event.inputs.source_ref }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Commit SHA** | \`${{ steps.meta.outputs.short_sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Promoted Version Tag** | \`${{ steps.meta.outputs.version }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Target Infrastructure** | \`docker-compose.prod.yaml\` (project: \`scoreboard-prod\`) |" >> $GITHUB_STEP_SUMMARY
          echo "| **Production App Endpoint** | \`http://localhost:8010\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Production PostgreSQL Port** | \`localhost:5435\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Storage Isolation** | \`scoreboard-prod-pgdata\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Pre-Promotion Verification** | ${{ github.event.inputs.run_tests != 'false' && '✅ Enabled & Verified' || '⚠️ Skipped by user' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Post-Promotion E2E Tests** | ${{ (github.event.inputs.dry_run != 'true' && github.event.inputs.run_e2e != 'false') && '✅ Passed against :8010' || '⚠️ Skipped' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Audit Notes** | *${{ github.event.inputs.promotion_notes }}* |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
