name: Promote Dev to Production

on:
  workflow_dispatch:
    inputs:
      tag_override:
        description: "Image tag to promote (leave blank to promote tag currently running in dev)"
        required: false
        default: ""
        type: string
      promotion_notes:
        description: "Audit / changelog note for this production promotion"
        required: false
        default: "Promoting verified dev version to production"
        type: string

concurrency:
  group: production-deployment
  cancel-in-progress: false

permissions:
  contents: read
  packages: read

jobs:
  promote:
    name: Promote Dev Version to Production (Oracle Cloud)
    runs-on: ubuntu-latest
    steps:
      - name: SSH into Oracle Cloud & Promote Dev Image to Production
        uses: appleboy/ssh-action@v1
        env:
          TAG_OVERRIDE: ${{ github.event.inputs.tag_override }}
          PROMOTION_NOTES: ${{ github.event.inputs.promotion_notes }}
          ACTOR: ${{ github.actor }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          envs: TAG_OVERRIDE,PROMOTION_NOTES,ACTOR,GHCR_USER,GHCR_TOKEN
          script: |
            set -e
            echo "=========================================================="
            echo " Sports League Scoreboard - Promote Dev to Production"
            echo " Host: Oracle Cloud Server"
            echo " Actor: $ACTOR"
            echo " Notes: $PROMOTION_NOTES"
            echo "=========================================================="

            cd ~/sports-league-scoreboard

            # ------------------------------------------------------------------
            # 1. Detect Tag Currently Running in Dev
            # ------------------------------------------------------------------
            if [ -n "$TAG_OVERRIDE" ]; then
              TARGET_TAG="$TAG_OVERRIDE"
              echo "Using manual tag override: $TARGET_TAG"
            elif [ -f .current-dev-tag ] && [ -s .current-dev-tag ]; then
              TARGET_TAG=$(cat .current-dev-tag | tr -d '[:space:]')
              echo "Detected dev tag from .current-dev-tag: $TARGET_TAG"
            else
              RUNNING_IMG=$(docker inspect scoreboard-app --format '{{.Config.Image}}' 2>/dev/null || echo "")
              if [ -n "$RUNNING_IMG" ]; then
                TARGET_TAG="${RUNNING_IMG##*:}"
                echo "Detected dev tag from running container (scoreboard-app): $TARGET_TAG"
              else
                echo "ERROR: Unable to detect running dev container tag and no tag_override provided."
                exit 1
              fi
            fi

            # ------------------------------------------------------------------
            # 2. Resolve Full Image URI
            # ------------------------------------------------------------------
            if [[ "$TARGET_TAG" == *"/"* ]]; then
              EXACT_IMAGE="$TARGET_TAG"
            elif [ -f .current-dev-image ] && [ -s .current-dev-image ]; then
              EXACT_IMAGE=$(cat .current-dev-image | tr -d '[:space:]')
            else
              RUNNING_IMG=$(docker inspect scoreboard-app --format '{{.Config.Image}}' 2>/dev/null || echo "")
              if [[ "$RUNNING_IMG" == *"/"* ]]; then
                BASE_NAME="${RUNNING_IMG%:*}"
                EXACT_IMAGE="${BASE_NAME}:${TARGET_TAG}"
              else
                EXACT_IMAGE="sports-scoreboard:${TARGET_TAG}"
              fi
            fi

            echo "----------------------------------------------------------"
            echo " Exact Image to Promote: $EXACT_IMAGE"
            echo " Exact Tag:              $TARGET_TAG"
            echo "----------------------------------------------------------"

            # ------------------------------------------------------------------
            # 3. Pull That Exact Same Image on the Server
            # ------------------------------------------------------------------
            if [[ "$EXACT_IMAGE" == "ghcr.io"* ]]; then
              echo "Authenticating with GitHub Container Registry (ghcr.io)..."
              echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
              echo "Pulling $EXACT_IMAGE from ghcr.io on the server..."
              docker pull "$EXACT_IMAGE"
            else
              echo "Local/custom image reference ($EXACT_IMAGE), ensuring available locally..."
              docker image inspect "$EXACT_IMAGE" > /dev/null 2>&1 || docker pull "$EXACT_IMAGE" || true
            fi

            # ------------------------------------------------------------------
            # 4. Ensure Production Environment Configuration Exists
            # ------------------------------------------------------------------
            if [ ! -f .env.prod ]; then
              echo "Initializing .env.prod from template..."
              cp .env.prod.example .env.prod
              RANDOM_JWT=$(openssl rand -hex 32)
              sed -i "s/JWT_SECRET_KEY=.*/JWT_SECRET_KEY=${RANDOM_JWT}/" .env.prod
            fi

            # ------------------------------------------------------------------
            # 5. Deploy to Production Container
            # ------------------------------------------------------------------
            echo "Deploying to production container (scoreboard-prod-app)..."
            DEPLOYED_VERSION="$TARGET_TAG" PROD_APP_IMAGE="$EXACT_IMAGE" docker compose -f docker-compose.prod.yaml --env-file .env.prod up -d --no-deps app

            # Save state records
            echo "$TARGET_TAG" > .current-prod-tag
            echo "$EXACT_IMAGE" > .current-prod-image

            # ------------------------------------------------------------------
            # 6. Verify Production Container Health
            # ------------------------------------------------------------------
            echo "Waiting for production backend to report healthy on port 8010..."
            timeout 60s bash -c 'until curl -sf http://localhost:8010/health | grep -q "healthy"; do
              echo "Waiting for production healthcheck response..."
              sleep 2
            done'

            echo "Production health check confirmed at http://localhost:8010/health!"
            curl -i http://localhost:8010/health

            echo "=========================================================="
            echo " PROMOTION COMPLETE!"
            echo " Image: $EXACT_IMAGE"
            echo " Port:  8010"
            echo " Status: Healthy"
            echo "=========================================================="

      - name: Generate Promotion Summary
        if: always()
        run: |
          echo "## 🚀 Production Promotion Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          echo "| **Status** | ${{ job.status == 'success' && '✅ Successfully Promoted' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Target Server** | Oracle Cloud Server |" >> $GITHUB_STEP_SUMMARY
          echo "| **Promoted By** | \`@${{ github.actor }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Source Environment** | Development (\`scoreboard-app\` on :8009) |" >> $GITHUB_STEP_SUMMARY
          echo "| **Target Environment** | Production (\`scoreboard-prod-app\` on :8010) |" >> $GITHUB_STEP_SUMMARY
          echo "| **Strategy** | Pulls exact tag currently running in dev |" >> $GITHUB_STEP_SUMMARY
          echo "| **Production Health** | Verified at \`http://localhost:8010/health\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Notes** | *${{ github.event.inputs.promotion_notes }}* |" >> $GITHUB_STEP_SUMMARY
