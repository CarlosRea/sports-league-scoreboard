services:
  postgres:
    image: postgres:16-alpine
    container_name: scoreboard-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sdip}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sdip}
      POSTGRES_DB: ${POSTGRES_DB:-sdip}
    ports:
      - "${POSTGRES_PORT:-5434}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sdip} -d ${POSTGRES_DB:-sdip}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      default:
        aliases:
          - db

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${APP_IMAGE:-sports-scoreboard:latest}
    container_name: scoreboard-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-sdip}:${POSTGRES_PASSWORD:-sdip}@postgres:5432/${POSTGRES_DB:-sdip}
      SDIP_DATABASE_URL: postgresql://${POSTGRES_USER:-sdip}:${POSTGRES_PASSWORD:-sdip}@postgres:5432/${POSTGRES_DB:-sdip}
      PORT: 8009
      HOST: 0.0.0.0
      ENVIRONMENT: ${ENVIRONMENT:-development}
      SERVICE_NAME: ${SERVICE_NAME:-sports-league-scoreboard}
      DEPLOYED_VERSION: ${DEPLOYED_VERSION:-0.1.0}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-sports-league-scoreboard}
      OTEL_SERVICE_VERSION: ${OTEL_SERVICE_VERSION:-0.1.0}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://scoreboard-otel-collector:4318}
    ports:
      - "${APP_PORT:-8009}:8009"
    networks:
      - default
      - observability-network

volumes:
  pgdata:
    name: scoreboard-pgdata

networks:
  default:
  observability-network:
    name: scoreboard-observability-net
    external: true
