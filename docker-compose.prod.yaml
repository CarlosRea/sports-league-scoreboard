name: scoreboard-prod

services:
  postgres:
    image: postgres:16-alpine
    container_name: scoreboard-prod-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-scoreboard_prod_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-scoreboard_prod_secure_password_2026!}
      POSTGRES_DB: ${POSTGRES_DB:-scoreboard_prod}
    ports:
      - "${POSTGRES_PORT:-5435}:5432"
    volumes:
      - pgdata_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-scoreboard_prod_user} -d ${POSTGRES_DB:-scoreboard_prod}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      prod-network:
        aliases:
          - db
          - postgres

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${PROD_APP_IMAGE:-${APP_IMAGE:-sports-scoreboard:prod}}
    container_name: scoreboard-prod-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-scoreboard_prod_user}:${POSTGRES_PASSWORD:-scoreboard_prod_secure_password_2026!}@postgres:5432/${POSTGRES_DB:-scoreboard_prod}
      SDIP_DATABASE_URL: postgresql://${POSTGRES_USER:-scoreboard_prod_user}:${POSTGRES_PASSWORD:-scoreboard_prod_secure_password_2026!}@postgres:5432/${POSTGRES_DB:-scoreboard_prod}
      PORT: 8009
      HOST: 0.0.0.0
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-prod_jwt_secret_scoreboard_super_secure_vault_token_2026}
      ENVIRONMENT: production
      SERVICE_NAME: ${SERVICE_NAME:-sports-league-scoreboard}
      DEPLOYED_VERSION: ${DEPLOYED_VERSION:-0.1.0}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-sports-league-scoreboard}
      OTEL_SERVICE_VERSION: ${OTEL_SERVICE_VERSION:-0.1.0}
    ports:
      - "${APP_PORT:-8010}:8009"
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8009/health')\""]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      prod-network:

volumes:
  pgdata_prod:
    name: scoreboard-prod-pgdata

networks:
  prod-network:
    name: scoreboard-prod-network
